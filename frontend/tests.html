<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnostic Tests - QuickDiag System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white flex min-h-screen">

  <div id="sidebar-container"></div>

  <div class="flex-1 flex flex-col min-w-0">
    <div id="header-container"></div>

    <main class="p-6 space-y-6 max-w-7xl w-full mx-auto">
      
      <!-- Header -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h2 class="text-2xl font-extrabold tracking-tight">Diagnostic Test Catalog</h2>
          <p class="text-slate-500 dark:text-slate-400 text-sm">Browse pathology, radiology, cardiology procedures, pricing, and preparation guidelines.</p>
        </div>
        <button id="btn-add-test" onclick="openTestModal()" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs shadow-lg shadow-blue-500/20 transition flex items-center gap-2">
          <i data-lucide="plus" class="w-4 h-4"></i> Add New Diagnostic Test
        </button>
      </div>

      <!-- Filters Bar -->
      <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col md:flex-row gap-4 justify-between items-center">
        <div class="relative w-full md:w-80">
          <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
          <input type="text" id="test-search-input" placeholder="Search test name or code..." class="w-full pl-10 pr-4 py-2 bg-slate-100 dark:bg-slate-700/50 rounded-xl text-sm border-none outline-none">
        </div>
        <div id="category-pills" class="flex flex-wrap items-center gap-2">
          <!-- Dynamic Category Pills -->
        </div>
      </div>

      <!-- Tests Cards Grid -->
      <div id="tests-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Dynamic Cards -->
      </div>

    </main>
  </div>

  <!-- Add/Edit Test Modal -->
  <div id="test-modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
        <h3 id="test-modal-title" class="font-extrabold text-lg">Add New Diagnostic Test</h3>
        <button onclick="closeModal('test-modal')" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>

      <form id="test-form" class="space-y-3 text-xs">
        <input type="hidden" id="edit-test-id">

        <div>
          <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Test Name *</label>
          <input type="text" id="t-name" required placeholder="e.g. Lipid Profile" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Category *</label>
            <select id="t-category" required class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none font-medium">
              <option value="Pathology">Pathology</option>
              <option value="Radiology">Radiology</option>
              <option value="Cardiology">Cardiology</option>
              <option value="Molecular">Molecular</option>
            </select>
          </div>

          <div>
            <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Price ($) *</label>
            <input type="number" id="t-price" required step="0.01" min="0" placeholder="60.00" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none">
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Estimated Report Lead Time (Hours)</label>
          <input type="number" id="t-hours" value="24" min="1" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none">
        </div>

        <div>
          <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Clinical Description</label>
          <textarea id="t-desc" rows="2" placeholder="Summary of parameters checked..." class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none"></textarea>
        </div>

        <div>
          <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Preparation Instructions</label>
          <textarea id="t-prep" rows="2" placeholder="Fasting instructions..." class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-3 border-t border-slate-100 dark:border-slate-800">
          <button type="button" onclick="closeModal('test-modal')" class="px-4 py-2 font-bold text-slate-500 hover:bg-slate-100 rounded-xl">Cancel</button>
          <button type="submit" class="px-5 py-2.5 font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-lg shadow-blue-500/20">Save Diagnostic Test</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/tests.js"></script>
</body>
</html>
