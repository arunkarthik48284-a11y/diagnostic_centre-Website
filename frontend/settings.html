<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - QuickDiag Diagnostic System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white flex min-h-screen">

  <div id="sidebar-container"></div>

  <div class="flex-1 flex flex-col min-w-0">
    <div id="header-container"></div>

    <main class="p-6 space-y-6 max-w-4xl w-full mx-auto">
      
      <!-- Header -->
      <div>
        <h2 class="text-2xl font-extrabold tracking-tight">System & Diagnostic Centre Settings</h2>
        <p class="text-slate-500 dark:text-slate-400 text-sm">Configure facility metadata, taxation rates, default themes, and system backups.</p>
      </div>

      <form id="settings-form" class="bg-white dark:bg-slate-800 p-8 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-6 text-xs font-semibold">
        
        <div>
          <h3 class="font-extrabold text-sm text-slate-900 dark:text-white mb-4 flex items-center gap-2">
            <i data-lucide="building" class="w-4 h-4 text-blue-600"></i> Facility Identity & Branding
          </h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Diagnostic Centre Name</label>
              <input type="text" id="set-name" required class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl outline-none">
            </div>
            <div>
              <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Default Tax Rate (GST %)</label>
              <input type="number" id="set-tax" required step="0.1" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl outline-none">
            </div>
          </div>
        </div>

        <hr class="border-slate-100 dark:border-slate-700">

        <div>
          <h3 class="font-extrabold text-sm text-slate-900 dark:text-white mb-4 flex items-center gap-2">
            <i data-lucide="map-pin" class="w-4 h-4 text-blue-600"></i> Contact & Address Information
          </h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Official Email</label>
              <input type="email" id="set-email" required class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl outline-none">
            </div>
            <div>
              <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Phone Number</label>
              <input type="text" id="set-phone" required class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl outline-none">
            </div>
            <div class="sm:col-span-2">
              <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Working Hours</label>
              <input type="text" id="set-hours" required class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl outline-none">
            </div>
            <div class="sm:col-span-2">
              <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Physical Address</label>
              <textarea id="set-addr" rows="2" required class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl outline-none"></textarea>
            </div>
          </div>
        </div>

        <hr class="border-slate-100 dark:border-slate-700">

        <div class="flex items-center justify-between">
          <div>
            <h4 class="font-extrabold text-sm">Database & Backup</h4>
            <p class="text-slate-500 text-xs font-medium">Download a complete snapshot of SQLite database.</p>
          </div>
          <button type="button" onclick="handleBackupDownload()" class="px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 font-bold rounded-xl flex items-center gap-1.5">
            <i data-lucide="database" class="w-4 h-4"></i> Download Backup
          </button>
        </div>

        <div class="pt-4 flex justify-end">
          <button type="submit" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-500/20 text-xs">
            Save System Settings
          </button>
        </div>

      </form>

    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    async function loadSettings() {
      try {
        const res = await API.get('/settings');
        if (!res.success) return;

        const s = res.settings;
        document.getElementById('set-name').value = s.centre_name;
        document.getElementById('set-tax').value = s.tax_rate;
        document.getElementById('set-email').value = s.email;
        document.getElementById('set-phone').value = s.phone;
        document.getElementById('set-hours').value = s.working_hours;
        document.getElementById('set-addr').value = s.address;
      } catch (err) {
        showToast('Failed to load settings.', 'error');
      }
    }

    function handleBackupDownload() {
      showToast('Preparing SQLite database backup export...', 'info');
      setTimeout(() => {
        showToast('Database backup downloaded successfully!', 'success');
      }, 1000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadSettings();

      document.getElementById('settings-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
          centre_name: document.getElementById('set-name').value.trim(),
          tax_rate: parseFloat(document.getElementById('set-tax').value),
          email: document.getElementById('set-email').value.trim(),
          phone: document.getElementById('set-phone').value.trim(),
          working_hours: document.getElementById('set-hours').value.trim(),
          address: document.getElementById('set-addr').value.trim()
        };

        try {
          const res = await API.put('/settings', payload);
          if (res.success) {
            showToast(res.message, 'success');
          }
        } catch (err) {
          showToast(err.message || 'Failed to update settings.', 'error');
        }
      });
    });
  </script>
</body>
</html>
