<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - QuickDiag System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white flex min-h-screen">

  <div id="sidebar-container"></div>

  <div class="flex-1 flex flex-col min-w-0">
    <div id="header-container"></div>

    <main class="p-6 space-y-6 max-w-4xl w-full mx-auto">
      
      <div>
        <h2 class="text-2xl font-extrabold tracking-tight">Account Profile</h2>
        <p class="text-slate-500 dark:text-slate-400 text-sm">Manage personal details, avatar photo, and security credentials.</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Avatar Card -->
        <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col items-center text-center">
          <img id="prof-avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=250" class="w-24 h-24 rounded-full object-cover border-4 border-blue-500 shadow-md mb-4">
          <h3 id="prof-name-title" class="font-extrabold text-lg text-slate-900 dark:text-white">Dr. Sarah Jenkins</h3>
          <span id="prof-role-badge" class="px-3 py-1 mt-1 rounded-full text-xs font-bold bg-blue-100 text-blue-700 dark:bg-blue-950 dark:text-blue-300">Admin</span>
          <p id="prof-email-sub" class="text-xs text-slate-400 mt-2">admin@quickdiag.com</p>
        </div>

        <!-- Details Form -->
        <div class="md:col-span-2 space-y-6">
          <form id="profile-form" class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4 text-xs font-semibold">
            <h4 class="font-extrabold text-sm border-b border-slate-100 dark:border-slate-700 pb-2">Personal Information</h4>
            <div>
              <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Full Name</label>
              <input type="text" id="prof-name" required class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl outline-none">
            </div>

            <div>
              <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Phone Number</label>
              <input type="text" id="prof-phone" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl outline-none">
            </div>

            <div>
              <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Change Avatar Image</label>
              <input type="file" id="prof-avatar-file" accept="image/*" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl outline-none">
            </div>

            <button type="submit" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs shadow-md">
              Update Profile Details
            </button>
          </form>

          <!-- Password Change Form -->
          <form id="password-form" class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4 text-xs font-semibold">
            <h4 class="font-extrabold text-sm border-b border-slate-100 dark:border-slate-700 pb-2">Security & Password</h4>
            <div>
              <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Current Password</label>
              <input type="password" id="pass-current" required placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl outline-none">
            </div>

            <div>
              <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">New Password</label>
              <input type="password" id="pass-new" required placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl outline-none">
            </div>

            <button type="submit" class="px-5 py-2.5 bg-slate-900 hover:bg-black text-white font-bold rounded-xl text-xs shadow-md">
              Change Security Password
            </button>
          </form>
        </div>
      </div>

    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    async function loadProfile() {
      try {
        const res = await API.get('/auth/profile');
        if (!res.success) return;

        const u = res.user;
        document.getElementById('prof-name-title').innerText = u.name;
        document.getElementById('prof-role-badge').innerText = u.role;
        document.getElementById('prof-email-sub').innerText = u.email;
        if (u.avatar) document.getElementById('prof-avatar').src = u.avatar;

        document.getElementById('prof-name').value = u.name;
        document.getElementById('prof-phone').value = u.phone || '';
      } catch (err) {
        showToast('Failed to load profile.', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadProfile();

      document.getElementById('profile-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('prof-name').value.trim();
        const phone = document.getElementById('prof-phone').value.trim();
        const avatarFile = document.getElementById('prof-avatar-file').files[0];

        const formData = new FormData();
        formData.append('name', name);
        formData.append('phone', phone);
        if (avatarFile) formData.append('avatar', avatarFile);

        try {
          const res = await API.put('/auth/profile', formData);
          if (res.success) {
            localStorage.setItem('qd_user', JSON.stringify(res.user));
            showToast(res.message, 'success');
            loadProfile();
            Auth.renderLayout();
          }
        } catch (err) {
          showToast(err.message || 'Failed to update profile.', 'error');
        }
      });

      document.getElementById('password-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const currentPassword = document.getElementById('pass-current').value;
        const newPassword = document.getElementById('pass-new').value;

        try {
          const res = await API.put('/auth/change-password', { currentPassword, newPassword });
          if (res.success) {
            showToast(res.message, 'success');
            document.getElementById('password-form').reset();
          }
        } catch (err) {
          showToast(err.message || 'Error changing password.', 'error');
        }
      });
    });
  </script>
</body>
</html>
