<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | QuickDiag</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-6 text-center">

  <div class="max-w-md w-full space-y-6">
    <div class="w-20 h-20 rounded-3xl bg-blue-600/20 text-blue-500 flex items-center justify-center mx-auto text-4xl font-extrabold border border-blue-500/30 shadow-2xl">
      404
    </div>
    
    <h1 class="text-3xl font-extrabold tracking-tight">Diagnostic Record Not Found</h1>
    <p class="text-slate-400 text-sm">The medical portal view or URL resource you were trying to access does not exist or has been relocated.</p>

    <a href="/dashboard.html" class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-xs rounded-xl shadow-lg shadow-blue-500/25 hover:from-blue-700 hover:to-indigo-700 transition">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Return to Main Dashboard
    </a>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
