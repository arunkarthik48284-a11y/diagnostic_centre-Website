<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointments - QuickDiag Diagnostic System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white flex min-h-screen">

  <div id="sidebar-container"></div>

  <div class="flex-1 flex flex-col min-w-0">
    <div id="header-container"></div>

    <main class="p-6 space-y-6 max-w-7xl w-full mx-auto">
      
      <!-- Page Header -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h2 class="text-2xl font-extrabold tracking-tight">Appointments & Sample Tracking</h2>
          <p class="text-slate-500 dark:text-slate-400 text-sm">Schedule patient tests, track specimen lifecycle, and monitor diagnostic progress.</p>
        </div>
        <div class="flex items-center gap-3">
          <button onclick="handleExportAppointments()" class="px-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 font-bold rounded-xl text-xs hover:bg-slate-50 dark:hover:bg-slate-700 transition flex items-center gap-2">
            <i data-lucide="download" class="w-4 h-4"></i> Export CSV
          </button>
          <button onclick="openBookingModal()" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs shadow-lg shadow-blue-500/20 transition flex items-center gap-2">
            <i data-lucide="calendar-plus" class="w-4 h-4"></i> Book Appointment
          </button>
        </div>
      </div>

      <!-- Filters Row -->
      <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col md:flex-row gap-4 justify-between items-center">
        <div class="relative w-full md:w-72">
          <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
          <input type="text" id="apt-search-input" placeholder="Search number, patient, phone..." class="w-full pl-10 pr-4 py-2 bg-slate-100 dark:bg-slate-700/50 rounded-xl text-sm border-none outline-none">
        </div>
        <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
          <input type="date" id="apt-date-filter" class="px-3 py-2 bg-slate-100 dark:bg-slate-700/50 rounded-xl text-xs font-semibold border-none outline-none">
          <select id="apt-status-filter" class="px-3 py-2 bg-slate-100 dark:bg-slate-700/50 rounded-xl text-xs font-semibold border-none outline-none">
            <option value="">All Statuses</option>
            <option value="Booked">Booked</option>
            <option value="Sample Collected">Sample Collected</option>
            <option value="Testing">Testing</option>
            <option value="Report Ready">Report Ready</option>
            <option value="Completed">Completed</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>
      </div>

      <!-- Appointments List Table -->
      <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-50 dark:bg-slate-900/60 text-slate-500 font-bold text-xs uppercase border-b border-slate-200 dark:border-slate-700">
              <tr>
                <th class="px-6 py-4">Appt #</th>
                <th class="px-6 py-4">Patient</th>
                <th class="px-6 py-4">Date & Time</th>
                <th class="px-6 py-4">Tests Included</th>
                <th class="px-6 py-4">Status</th>
                <th class="px-6 py-4">Sample Pipeline</th>
                <th class="px-6 py-4 text-center">Actions</th>
              </tr>
            </thead>
            <tbody id="appointments-tbody" class="divide-y divide-slate-100 dark:divide-slate-800 text-xs font-semibold">
              <!-- Dynamic Rows -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- Book Appointment Modal -->
  <div id="booking-modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-2xl w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
        <h3 class="font-extrabold text-lg">Book New Diagnostic Appointment</h3>
        <button onclick="closeModal('booking-modal')" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>

      <form id="booking-form" class="space-y-4 text-xs">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Select Patient *</label>
            <select id="b-patient-id" required class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none font-medium">
              <!-- Dynamic options -->
            </select>
          </div>

          <div>
            <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Ref Doctor Name</label>
            <input type="text" id="b-doctor" placeholder="Dr. Arthur Conan" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none">
          </div>

          <div>
            <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Appointment Date *</label>
            <input type="date" id="b-date" required class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none">
          </div>

          <div>
            <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Time Slot *</label>
            <select id="b-time" required class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none font-medium">
              <option value="08:00 AM">08:00 AM</option>
              <option value="09:00 AM">09:00 AM</option>
              <option value="10:00 AM">10:00 AM</option>
              <option value="11:00 AM">11:00 AM</option>
              <option value="02:00 PM">02:00 PM</option>
              <option value="04:00 PM">04:00 PM</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Select Diagnostic Tests *</label>
          <div id="b-tests-container" class="max-h-40 overflow-y-auto p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl space-y-2">
            <!-- Dynamic checkboxes -->
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-slate-100 dark:bg-slate-800/60 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-700">
          <div>
            <span class="text-slate-500 font-bold block">Subtotal</span>
            <span id="b-subtotal" class="font-extrabold text-slate-900 dark:text-white text-sm">$0.00</span>
          </div>
          <div>
            <label class="block font-bold text-slate-600 dark:text-slate-400">Discount ($)</label>
            <input type="number" id="b-discount" value="0" min="0" class="w-full px-2 py-1 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg text-xs outline-none">
          </div>
          <div>
            <span class="text-slate-500 font-bold block">Estimated Total</span>
            <span id="b-grandtotal" class="font-extrabold text-blue-600 text-sm">$0.00</span>
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Remarks / Clinical Notes</label>
          <textarea id="b-remarks" rows="2" placeholder="Fasting instructions or special requirements..." class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-3 border-t border-slate-100 dark:border-slate-800">
          <button type="button" onclick="closeModal('booking-modal')" class="px-4 py-2 font-bold text-slate-500 hover:bg-slate-100 rounded-xl">Cancel</button>
          <button type="submit" class="px-5 py-2.5 font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-lg shadow-blue-500/20">Confirm Booking</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Status Update Pipeline Modal -->
  <div id="status-modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <h3 class="font-extrabold text-lg">Update Sample & Appt Status</h3>
      <input type="hidden" id="status-apt-id">

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Appointment Status</label>
          <select id="st-apt-status" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none font-semibold">
            <option value="Booked">Booked</option>
            <option value="Sample Collected">Sample Collected</option>
            <option value="In Lab">In Lab</option>
            <option value="Testing">Testing</option>
            <option value="Report Ready">Report Ready</option>
            <option value="Completed">Completed</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>

        <div>
          <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Sample Tracking Pipeline</label>
          <select id="st-sample-status" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none font-semibold">
            <option value="Pending">1. Pending Collection</option>
            <option value="Collected">2. Sample Collected</option>
            <option value="In Lab">3. Received In Lab</option>
            <option value="Testing">4. Testing Underway</option>
            <option value="Quality Check">5. Quality Check</option>
            <option value="Report Ready">6. Report Ready</option>
            <option value="Delivered">7. Delivered to Patient</option>
          </select>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-3">
        <button onclick="closeModal('status-modal')" class="px-4 py-2 font-bold text-slate-500 hover:bg-slate-100 text-xs rounded-xl">Cancel</button>
        <button onclick="submitStatusUpdate()" class="px-5 py-2 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl">Update Pipeline</button>
      </div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/appointments.js"></script>
</body>
</html>
